                                                                                                                                                                                                    
  # =============================================================================
  # CONNECTIONS                                                                                                                                                                                     
  # =============================================================================
  # Max simultaneous connections (default unlimited — dangerous)
  # 20 services × ~3 connections each (consumer + publisher + health) = ~60                                                                                                                         
  # Set headroom for reconnects                                                                                                                                                                     
  num_acceptors.tcp = 10                                                                                                                                                                            
  connection_max = 256                                                                                                                                                                              
                                                                                                                                                                                                    
  # Heartbeat — detect dead connections (default 60s, too slow)                                                                                                                                     
  heartbeat = 30                                                                                                                                                                                    
                                                                                                                                                                                                    
  # Per-connection channel limit (prevent channel leak)                                                                                                                                             
  channel_max = 16
                                                                                                                                                                                                    
  # =============================================================================
  # MEMORY & DISK ALARMS
  # =============================================================================                                                                                                                   
  # Block publishers when memory exceeds this fraction of total RAM
  # Default 0.4 (40%) — too aggressive for small boxes                                                                                                                                              
  vm_memory_high_watermark.relative = 0.6                                                                                                                                                           
   
  # Paging threshold — start paging messages to disk before alarm                                                                                                                                   
  vm_memory_high_watermark_paging_ratio = 0.75              
                                                                                                                                                                                                    
  # Disk free space alarm — block publishing when disk is low
  # Absolute value is safer than relative for production                                                                                                                                            
  disk_free_limit.absolute = 2GB                                                                                                                                                                    
                                                                                                                                                                                                    
  # =============================================================================                                                                                                                   
  # QUEUES                                                                                                                                                                                          
  # =============================================================================
  # Default queue type — use quorum queues for durability
  # (classic queues can lose messages on unclean shutdown)                                                                                                                                          
  default_queue_type = quorum                                                                                                                                                                       
                                                                                                                                                                                                    
  # Lazy queues — keep messages on disk, not RAM                                                                                                                                                    
  # Critical for services with bursty traffic               
  queue_leader_locator = balanced                                                                                                                                                                   
                                                            
  # Max queue length (safety net — prevent unbounded growth)                                                                                                                                        
  # Set per-queue via policy, not globally                  
                                                                                                                                                                                                    
  # =============================================================================
  # CONSUMERS                                                                                                                                                                                       
  # =============================================================================
  # Default consumer prefetch (overridden by client ch.Qos)
  consumer_timeout = 1800000                                                                                                                                                                        
  # 30 minutes — kill consumers that don't ACK within this time                                                                                                                                     
  # Prevents stuck consumers from holding messages forever                                                                                                                                          
                                                                                                                                                                                                    
  # =============================================================================                                                                                                                   
  # MANAGEMENT PLUGIN                                       
  # =============================================================================                                                                                                                   
  management.tcp.port = 15672
                                                                                                                                                                                                    
  # Rate mode — detailed stats (slight CPU cost, worth it)                                                                                                                                          
  management.rates_mode = detailed
                                                                                                                                                                                                    
  # Collect stats every 10s (default 5s is too aggressive)                                                                                                                                          
  collect_statistics_interval = 10000                                                                                                                                                               
                                                                                                                                                                                                    
  # =============================================================================
  # LOGGING
  # =============================================================================
  log.file.level = info                                                                                                                                                                             
  log.console = true
  log.console.level = warning                                                                                                                                                                       
                                                            
  # Log connection events (helps debug client issues)                                                                                                                                               
  log.connection.level = info                               
                                                                                                                                                                                                    
  # =============================================================================
  # TLS (enable for production)                                                                                                                                                                     
