global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'padosme'
    environment: 'production'

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'

  - job_name: 'padosme-services'
    scrape_interval: 10s
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          cluster: 'padosme'

  # RabbitMQ exposes Prometheus metrics natively via the prometheus plugin.
  # Enabled in config/enabled_plugins.
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: 'rabbitmq'
