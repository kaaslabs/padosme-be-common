name: Deploy to Production

on:
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Config & Infra to Production
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to production server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.PROD_SSH_HOST }}
          username: ${{ vars.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,ssl,config,scripts,init-scripts"
          target: /opt/padosme/production/
          overwrite: true

      - name: Set file permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.PROD_SSH_HOST }}
          username: ${{ vars.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -e
            DEPLOY_DIR=/opt/padosme/production
            chmod 600 $DEPLOY_DIR/ssl/* 2>/dev/null || true
            chmod +x $DEPLOY_DIR/scripts/*.sh 2>/dev/null || true
            chmod +x $DEPLOY_DIR/init-scripts/*.sh 2>/dev/null || true
            echo "Production infra files deployed."
