# =============================================================================
# PadosMe Common — Full Stack Deployment
# =============================================================================
# 3-Environment Pipeline:
#   1. deploy-integration — Auto-deploys on push to develop (no approval)
#   2. deploy-staging     — Requires manual approval from @riyashmh
#   3. deploy-production  — Requires manual approval from @riyashmh + 5 min wait
#
# What gets deployed:
#   docker-compose.prod.yml  — Postgres, Redis, RabbitMQ, MongoDB,
#                              OTEL, Jaeger, Prometheus, Grafana
#   config/                  — OTEL, Prometheus, Grafana, RabbitMQ configs
#   init-scripts/            — Postgres multi-database init script
#   .env                     — Written at deploy time from GitHub secrets/vars
#                              (never committed to repo)
#
# Environment Protection Rules (configure in GitHub Settings > Environments):
#   - integration: no approval, branch restriction: develop
#   - staging:     require approval from @riyashmh
#   - production:  require approval from @riyashmh + wait timer (5 min),
#                  branch restriction: main
#
# Per-environment GitHub config (Settings > Environments > [env]):
#
#   Variables (non-sensitive, visible in logs):
#     CLOUD_HOST        — Server IP or hostname
#     CLOUD_USER        — SSH user (e.g. deploy)
#     CLOUD_PORT        — SSH port (e.g. 22)
#     CLOUD_DEPLOY_PATH — Deploy dir (e.g. /opt/padosme/integration/common)
#     DB_USER           — PostgreSQL username
#     RABBITMQ_USER     — RabbitMQ admin username
#     MONGO_USER        — MongoDB root username
#
#   Secrets (sensitive, masked in logs):
#     CLOUD_SSH_KEY              — SSH private key for deploy user
#     DB_PASSWORD                — PostgreSQL password
#     REDIS_PASSWORD             — Redis password
#     RABBITMQ_PASSWORD          — RabbitMQ password
#     MONGO_PASSWORD             — MongoDB root password
#     GF_SECURITY_ADMIN_PASSWORD — Grafana admin password
# =============================================================================

name: Deploy Common Stack

on:
  push:
    branches: [main, develop]
    paths:
      - 'docker-compose.prod.yml'
      - 'config/**'
      - 'init-scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'integration'
        type: choice
        options:
          - integration
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: Deploy to Integration
  # ============================================================================
  deploy-integration:
    name: Deploy to Integration
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'integration')

    environment:
      name: integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "docker-compose.prod.yml,config/,init-scripts/,scripts/"
          target: ${{ vars.CLOUD_DEPLOY_PATH }}
          strip_components: 0

      - name: Write .env and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            cd ${{ vars.CLOUD_DEPLOY_PATH }}

            # Write .env — docker compose reads this automatically.
            # chmod 600 so only the deploy user can read credentials.
            cat > .env << 'ENVEOF'
            DB_USER=${{ vars.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            RABBITMQ_USER=${{ vars.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            MONGO_USER=${{ vars.MONGO_USER }}
            MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
            GF_SECURITY_ADMIN_PASSWORD=${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
            ENVEOF
            chmod 600 .env

            docker network create padosme-network 2>/dev/null || true
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

      - name: Verify containers are running
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            cd ${{ vars.CLOUD_DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml ps
            RUNNING=$(docker compose -f docker-compose.prod.yml ps --status running -q | wc -l)
            if [ "$RUNNING" -lt 8 ]; then
              echo "ERROR: Only $RUNNING/8 containers running"
              docker compose -f docker-compose.prod.yml logs --tail=30
              exit 1
            fi
            echo "All $RUNNING containers are running."

  # ============================================================================
  # JOB 2: Deploy to Staging
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')

    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "docker-compose.prod.yml,config/,init-scripts/"
          target: ${{ vars.CLOUD_DEPLOY_PATH }}
          strip_components: 0

      - name: Write .env and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            cd ${{ vars.CLOUD_DEPLOY_PATH }}

            cat > .env << 'ENVEOF'
            DB_USER=${{ vars.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            RABBITMQ_USER=${{ vars.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            MONGO_USER=${{ vars.MONGO_USER }}
            MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
            GF_SECURITY_ADMIN_PASSWORD=${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
            ENVEOF
            chmod 600 .env

            docker network create padosme-network 2>/dev/null || true
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

      - name: Verify containers are running
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            cd ${{ vars.CLOUD_DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml ps
            RUNNING=$(docker compose -f docker-compose.prod.yml ps --status running -q | wc -l)
            if [ "$RUNNING" -lt 8 ]; then
              echo "ERROR: Only $RUNNING/8 containers running"
              docker compose -f docker-compose.prod.yml logs --tail=30
              exit 1
            fi
            echo "All $RUNNING containers are running."

  # ============================================================================
  # JOB 3: Deploy to Production
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "docker-compose.prod.yml,config/,init-scripts/"
          target: ${{ vars.CLOUD_DEPLOY_PATH }}
          strip_components: 0

      - name: Write .env and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            cd ${{ vars.CLOUD_DEPLOY_PATH }}

            cat > .env << 'ENVEOF'
            DB_USER=${{ vars.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            RABBITMQ_USER=${{ vars.RABBITMQ_USER }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            MONGO_USER=${{ vars.MONGO_USER }}
            MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
            GF_SECURITY_ADMIN_PASSWORD=${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
            ENVEOF
            chmod 600 .env

            docker network create padosme-network 2>/dev/null || true
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

      - name: Verify containers are running
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            cd ${{ vars.CLOUD_DEPLOY_PATH }}
            docker compose -f docker-compose.prod.yml ps
            RUNNING=$(docker compose -f docker-compose.prod.yml ps --status running -q | wc -l)
            if [ "$RUNNING" -lt 8 ]; then
              echo "ERROR: Only $RUNNING/8 containers running"
              docker compose -f docker-compose.prod.yml logs --tail=30
              exit 1
            fi
            echo "All $RUNNING containers are running."
