name: Deploy Common Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=()
          [[ -z "${{ secrets.CLOUD_HOST }}" ]] && missing+=("CLOUD_HOST")
          [[ -z "${{ secrets.CLOUD_USER }}" ]] && missing+=("CLOUD_USER")
          [[ -z "${{ secrets.CLOUD_PORT }}" ]] && missing+=("CLOUD_PORT")
          [[ -z "${{ secrets.CLOUD_SSH_KEY }}" ]] && missing+=("CLOUD_SSH_KEY")
          [[ -z "${{ secrets.CLOUD_DEPLOY_PATH }}" ]] && missing+=("CLOUD_DEPLOY_PATH")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "."
          target: ${{ secrets.CLOUD_DEPLOY_PATH }}

      - name: Copy scripts to /opt/padosme/common/scripts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            mkdir -p /opt/padosme/common/scripts
            cp -r ${{ secrets.CLOUD_DEPLOY_PATH }}/scripts/. /opt/padosme/common/scripts/
            chmod +x /opt/padosme/common/scripts/*.sh

      - name: Deploy via docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            cd ${{ secrets.CLOUD_DEPLOY_PATH }}
            docker compose down || true
            docker rm -f padosme-postgres padosme-redis padosme-ollama padosme-jaeger padosme-prometheus padosme-rabbitmq padosme-otel-collector padosme-redisinsight padosme-mongodb padosme-pgadmin padosme-grafana || true
            docker system prune -f || true
            docker network create padosme-network || true
            docker compose pull
            docker compose up -d --build

      - name: Ensure padosme database user exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            docker exec padosme-postgres psql -U postgres -c \
              "DO \$\$ BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'padosme') THEN
                  CREATE USER padosme WITH SUPERUSER PASSWORD 'kaaslabs123@dev';
                ELSE
                  ALTER USER padosme WITH PASSWORD 'kaaslabs123@dev';
                END IF;
              END \$\$;"

      - name: Run database setup and migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            PGPORT=5434 \
            PGHOST=localhost \
            PGUSER=padosme \
            PGPASSWORD='kaaslabs123@dev' \
            bash /opt/padosme/common/scripts/setup-databases.sh --skip-migrations

      - name: Run RabbitMQ topology setup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            RABBITMQ_HOST=localhost \
            RABBITMQ_MGMT_PORT=15673 \
            RABBITMQ_USER=cto \
            RABBITMQ_PASSWORD='kaaslabs123@dev' \
            bash /opt/padosme/common/scripts/setup-rabbitmq.sh
