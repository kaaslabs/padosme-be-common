name: Deploy Common Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "docker-compose.yml, config/,init-scrpits/, scripts/"
          target: ${{ secrets.CLOUD_DEPLOY_PATH }}
          strip_components: 0

      - name: Deploy via docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            cd ${{ secrets.CLOUD_DEPLOY_PATH }}
            docker compose down || true
            docker rm -f padosme-postgres padosme-redis padosme-ollama padosme-jaeger padosme-prometheus padosme-rabbitmq padosme-otel-collector padosme-redisinsight padosme-mongodb padosme-pgadmin padosme-grafana || true
            docker system prune -f || true
            docker network create padosme-network || true
            docker compose pull
            docker compose up -d --build

