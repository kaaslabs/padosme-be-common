# =============================================================================
# PadosMe Common — Observability Stack Deployment
# =============================================================================
# 3-Environment Pipeline:
#   1. deploy-integration — Auto-deploys on push to develop (no approval)
#   2. deploy-staging     — Requires manual approval from @riyashmh
#   3. deploy-production  — Requires manual approval from @riyashmh + 5 min wait
#
# What gets deployed:
#   docker-compose.prod.yml — OTEL collector, Jaeger, Prometheus, Grafana
#   config/                 — OTEL, Prometheus, Grafana provisioning configs
#
# What is NOT deployed (one-time manual setup on host/baremetal):
#   PostgreSQL, Redis, RabbitMQ, MongoDB
#   scripts/setup-rabbitmq.sh, scripts/setup-databases.sh
#   init-scripts/create-multiple-databases.sh
#
# Environment Protection Rules (configure in GitHub Settings > Environments):
#   - integration: no approval, branch restriction: develop
#   - staging:     require approval from @riyashmh
#   - production:  require approval from @riyashmh + wait timer (5 min),
#                  branch restriction: main
#
# Per-environment config (Settings > Environments > [env]):
#   Variables (visible in logs, easy to debug):
#     CLOUD_HOST, CLOUD_USER, CLOUD_PORT, CLOUD_DEPLOY_PATH
#   Secrets (masked in logs):
#     CLOUD_SSH_KEY, GF_SECURITY_ADMIN_PASSWORD
# =============================================================================

name: Deploy Observability Stack

on:
  push:
    branches: [main, develop]
    paths:
      - 'docker-compose.prod.yml'
      - 'config/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'integration'
        type: choice
        options:
          - integration
          - staging
          - production

# Cancel in-progress runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1: Secret Scan
  # ============================================================================
  scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2

  # ============================================================================
  # JOB 2: Deploy to Integration
  # ============================================================================
  deploy-integration:
    name: Deploy to Integration
    needs: scan
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'integration')

    environment:
      name: integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "docker-compose.prod.yml,docker-compose.admin-tools.yml,docker-compose.observability.yml,config/,scripts/,init-scripts/"
          target: ${{ vars.CLOUD_DEPLOY_PATH }}
          strip_components: 0

  # ============================================================================
  # JOB 3: Deploy to Staging
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: scan
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')

    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "docker-compose.prod.yml,docker-compose.admin-tools.yml,docker-compose.observability.yml,config/,scripts/,init-scripts/"
          target: ${{ vars.CLOUD_DEPLOY_PATH }}
          strip_components: 0

  # ============================================================================
  # JOB 4: Deploy to Production
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    needs: [scan, deploy-staging]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.CLOUD_HOST }}
          username: ${{ vars.CLOUD_USER }}
          port: ${{ vars.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "docker-compose.prod.yml,docker-compose.admin-tools.yml,docker-compose.observability.yml,config/,scripts/,init-scripts/"
          target: ${{ vars.CLOUD_DEPLOY_PATH }}
          strip_components: 0

