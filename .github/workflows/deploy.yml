name: Deploy Common Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=()
          [[ -z "${{ secrets.CLOUD_HOST }}" ]] && missing+=("CLOUD_HOST")
          [[ -z "${{ secrets.CLOUD_USER }}" ]] && missing+=("CLOUD_USER")
          [[ -z "${{ secrets.CLOUD_PORT }}" ]] && missing+=("CLOUD_PORT")
          [[ -z "${{ secrets.CLOUD_SSH_KEY }}" ]] && missing+=("CLOUD_SSH_KEY")
          [[ -z "${{ secrets.CLOUD_DEPLOY_PATH }}" ]] && missing+=("CLOUD_DEPLOY_PATH")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "."
          target: ${{ secrets.CLOUD_DEPLOY_PATH }}

      - name: Deploy via docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.CLOUD_DEPLOY_PATH }}
            docker-compose pull
            docker-compose up -d --remove-orphans
