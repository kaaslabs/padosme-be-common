name: Deploy Common Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.CLOUD_PORT || 22 }}
          source: "docker-compose.yml,config/,init-scripts/,scripts/"
          target: /opt/padosme/common/
          strip_components: 0

      - name: Deploy via docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.CLOUD_PORT || 22 }}
          script: |
            set -euo pipefail
            cd /opt/padosme/common
            docker-compose pull
            docker-compose up -d --remove-orphans
