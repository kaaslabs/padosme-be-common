name: Deploy Common Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 1: Copy files to server
      # Copies docker-compose.yml, config/, init-scripts/, scripts/
      # to $CLOUD_DEPLOY_PATH (e.g. /opt/padosme/common)
      # -----------------------------------------------------------------------
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          source: "docker-compose.yml,config/,init-scripts/,scripts/"
          target: ${{ secrets.CLOUD_DEPLOY_PATH }}
          strip_components: 0

      # -----------------------------------------------------------------------
      # Step 2: Deploy docker containers
      # Stops and removes all containers (running, exited, unhealthy),
      # then pulls latest images and starts all services.
      # -----------------------------------------------------------------------
      - name: Deploy docker containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            cd ${{ secrets.CLOUD_DEPLOY_PATH }}

            # Bring down only THIS compose stack and remove orphans
            # (does NOT affect other padosme services on the same host)
            docker compose -f docker-compose.yml down --remove-orphans || true

            # Ensure the shared network exists
            docker network create padosme-network 2>/dev/null || true

            # Pull latest images and start all services
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --build

      # -----------------------------------------------------------------------
      # Step 3: Initialize RabbitMQ topology
      # Runs after containers are up. Scripts have built-in readiness waits.
      # Ports per docker-compose.yml:
      #   RabbitMQ management -> 15673
      # -----------------------------------------------------------------------
      - name: Initialize RabbitMQ 
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          port: ${{ secrets.CLOUD_PORT || 22 }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          script: |
            cd ${{ secrets.CLOUD_DEPLOY_PATH }}
            chmod +x scripts/setup-rabbitmq.sh scripts/setup-databases.sh

            # Declare all RabbitMQ exchanges, queues and bindings
            ./scripts/setup-rabbitmq.sh
