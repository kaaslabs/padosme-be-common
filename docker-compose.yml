# Common infrastructure services for all Padosme backend microservices
# Start this before running individual microservices

services:
  postgres:
    image: postgres:16-alpine
    container_name: padosme-postgres
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=padosme
      - POSTGRES_PASSWORD=kaaslabs123@dev
      - POSTGRES_MULTIPLE_DATABASES=padosme_auth,padosme_profiles,padosme_sellers,padosme_notifications,rating_db,channel_service,padosme_coupon,wallet_service,subscription_service,payment_service,analytics_db,discovery,padosme_ledgers,padosme_config,padosme_location,padosme_indexing
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/create-multiple-databases.sh:/docker-entrypoint-initdb.d/create-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 2
    networks:
      - padosme-network

  redis:
    image: redis/redis-stack-server:7.2.0-v10
    container_name: padosme-redis
    environment:
      # Pass flags through the entrypoint so RediSearch + other modules load correctly.
      # Overriding 'command' bypasses /entrypoint.sh and skips module loading.
      - REDIS_ARGS=--appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 2
    networks:
      - padosme-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: padosme-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=cto
      - RABBITMQ_DEFAULT_PASS=kaaslabs123@dev
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 2
    networks:
      - padosme-network

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: padosme-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # Jaeger gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - padosme-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: padosme-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "8889:8889"    # Prometheus exporter metrics
    depends_on:
      - jaeger
      - prometheus
    networks:
      - padosme-network

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: padosme-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - padosme-network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: padosme-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=kaaslabs123@dev
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - padosme-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: padosme-pgadmin
    ports:
      - "8000:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=cto@kaaslabs.com
      - PGADMIN_DEFAULT_PASSWORD=kaaslabs123@dev
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - padosme-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: padosme-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - padosme-network

  # Ollama — LLM inference for padosme-ai-service (Mistral 7B intent classification).
  # CPU-only by default. After first start, pull the model:
  #   docker exec padosme-ollama ollama pull mistral:7b-instruct-q4_K_M
  # Uncomment the deploy block below if the server has an NVIDIA GPU
  # and nvidia-container-toolkit is installed.
  ollama:
    image: ollama/ollama:latest
    container_name: padosme-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - padosme-network
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
  mongodb:
    image: mongo:7
    container_name: padosme-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=padosme
      - MONGO_INITDB_ROOT_PASSWORD=kaaslabs123@dev
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 2
    networks:
      - padosme-network

networks:
  padosme-network:
    external: true

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  pgadmin-data:
  redisinsight-data:
  ollama-data:
  mongodb-data:

