# Common infrastructure services for all Padosme backend microservices
# Start this before running individual microservices

services:
  postgres:
    image: postgres:18-bookworm
    container_name: padosme-postgres
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=deploy
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me}
      - POSTGRES_MULTIPLE_DATABASES=padosme_auth,padosme_profiles,padosme_sellers,padosme_notifications,rating_db,channel_service,padosme_coupon,wallet_service,subscription_service,payment_service,analytics_db,discovery,padosme_ledgers,padosme_config,padosme_location,padosme_indexing,padosme_dictionary
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/create-multiple-databases.sh:/docker-entrypoint-initdb.d/create-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploy"]
      interval: 5s
      timeout: 5s
      retries: 2
    restart: unless-stopped
    networks:
      - padosme-network

  redis:
    image: redis:8.0-bookworm
    container_name: padosme-redis
    environment:
      # Pass flags through the entrypoint so RediSearch + other modules load correctly.
      # Overriding 'command' bypasses /entrypoint.sh and skips module loading.
      - REDIS_ARGS=--appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 2
    restart: unless-stopped
    networks:
      - padosme-network
    
  rabbitmq:                                                                                                                                                                                       
    image: rabbitmq:4.0.7-management
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    container_name: padosme-rabbitmq                           
    ports:                                                                                                                                                                                        
        - "5672:5672"     # AMQP
        - "15672:15672"   # Management UI                                                                                                                                                           
        - "15692:15692"   # Prometheus metrics                                                                                                                                                      
    environment:
        RABBITMQ_DEFAULT_USER: rmq_admin                                                                                                                                                            
        RABBITMQ_DEFAULT_PASS: ${RMQ_ADMIN_PASSWORD}        
        RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +sbwt very_long"                                                                                                                             
    volumes:                                                                                                                                                                                      
        - rabbitmq_data:/var/lib/rabbitmq                                                                                                                                                           
        - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro                                                                                                                                            
        - ./advanced.config:/etc/rabbitmq/advanced.config:ro
        - ./enabled_plugins:/etc/rabbitmq/enabled_plugins:ro                                                                                                                                        
    networks:
        - padosme-network                                                                                                                                                                           
    restart: unless-stopped                               
    healthcheck:                                                                                                                                                                                  
        test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
        interval: 30s                                                                                                                                                                               
        timeout: 10s                                        
        start_period: 30s
        retries: 3                                                                                                                                                                                  
    deploy:
        resources:                                                                                                                                                                                  
          limits:                                           
            memory: 2G
          reservations:
            memory: 1G
             

  jaeger:
    image: jaegertracing/jaeger:2.16.0
    container_name: padosme-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # Jaeger gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - padosme-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.148.0
    container_name: padosme-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "8889:8889"    # Prometheus exporter metrics
    depends_on:
      - jaeger
      - prometheus
    networks:
      - padosme-network

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: padosme-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - padosme-network

  grafana:
    image: grafana/grafana:12.4.2
    container_name: padosme-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-change-me}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - padosme-network

  pgadmin:
    image: dpage/pgadmin4:9.13
    container_name: padosme-pgadmin
    ports:
      - "8000:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=cto@kaaslabs.com
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-change-me}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - padosme-network

  redisinsight:
    image: redis/redisinsight:3.0.3
    container_name: padosme-redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - padosme-network

  mongodb:
    image: mmongo:8.0.20-bookworm
    container_name: padosme-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=deploy
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-change-me}
    volumes:
      - common_mongodb-data:/data/db:rw
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 2
    restart: unless-stopped
    networks:
      padosme-network:
        aliases:
          - padosme-mongodb
          - mongodb

networks:
  padosme-network:
    external: true

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  pgadmin-data:
  redisinsight-data:
  ollama-data:
  common_mongodb-data:
    name: common_mongodb-data
    
