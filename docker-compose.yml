version: '3.8'

# Common infrastructure services for all Padosme backend microservices
# Start this before running individual microservices

services:
  postgres:
    image: postgres:16-alpine
    container_name: padosme-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_DATABASES=padosme_auth,padosme_profiles,padosme_sellers,payment_service,wallet_service,subscription_service
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/create-multiple-databases.sh:/docker-entrypoint-initdb.d/create-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - padosme-network

  redis:
    image: redis:7-alpine
    container_name: padosme-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - padosme-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: padosme-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - padosme-network

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: padosme-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - padosme-network

networks:
  padosme-network:
    name: padosme-network
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
